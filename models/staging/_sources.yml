version: 2

sources:
  - name: spotify_raw
    description: >
      Kaggle "Spotify Charts Daily Updated" CSV files loaded as-is into the raw schema
      (all columns text; staging owns the casts). File load, refreshed daily.
    schema: raw
    tables:
      - name: charts_songs_daily
        description: Daily Top-200 song chart per country. Grain date x country x rank.
      - name: charts_artists_daily
        description: Daily Top-200 artist chart per country. Grain date x country x rank.
      - name: songs
        description: Song metadata, one row per canonical track_uri. all_uris lists release-specific URIs.
      - name: artists
        description: Artist metadata, one row per artist_uri. Listener columns unused downstream.
