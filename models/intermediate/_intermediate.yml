version: 2

models:
  - name: int_song_uri_aliases
    description: "Layer 1 key resolution. Grain: one release-specific URI -> canonical track_uri."
    columns:
      - name: alias_uri
        description: "VARCHAR. A release-specific track URI as it appears on a chart row."
        tests: [not_null, unique]
      - name: track_uri
        description: "VARCHAR. The canonical song this alias belongs to."
        tests: [not_null]

  - name: int_song
    description: >
      Layer 1 song dimension (SCD 1). Grain: one canonical song. Includes "unknown song"
      members for charting URIs that songs.csv does not describe, so the fact never
      loses a row to a missing dimension member.
    columns:
      - name: track_uri
        description: "VARCHAR. Natural key."
        tests: [not_null, unique]
      - name: release_date
        description: >
          DATE, nullable. Release date from songs.csv, or NULL when implausible
          (outside 1900-01-01 .. +1y) or unknown. Pre-2000 dates are kept: they are
          normally correct (catalogue titles chart every December).
        tests:
          - dbt_utils.accepted_range:
              min_value: "'1900-01-01'::date"
      - name: is_unknown_song
        description: "BOOLEAN. True for a member synthesised from the charts because songs.csv has no row."
        tests: [not_null]

  - name: int_label
    description: >
      Layer 1 label dimension (SCD 1), windowed to the ingestion period and built from
      the chart rows so referential integrity holds by construction. Carries an explicit
      '(unknown)' member.
    columns:
      - name: label_name_norm
        description: "VARCHAR. Natural key: lower(btrim(label)), or '(unknown)'."
        tests: [not_null, unique]
      - name: label_name
        description: "VARCHAR. Most frequent raw spelling for display."
        tests: [not_null]
      - name: label_group_norm
        description: "VARCHAR. Heuristic parent: the segment before the first '/', lower-cased. Not a curated hierarchy."
        tests: [not_null]

  - name: int_artist
    description: "Layer 1 artist dimension (SCD 1). Grain: one artist that charted in the window."
    columns:
      - name: artist_uri
        description: "VARCHAR. Natural key."
        tests: [not_null, unique]
      - name: artist_name
        description: "VARCHAR. From artists.csv, else the latest chart spelling. NOT unique."
        tests: [not_null]

  - name: int_date
    description: >
      Layer 1 date dimension (Static). Grain: one calendar day from chart_start_date
      (a Monday) to the Sunday one year out. No current_date-dependent flags.
    columns:
      - name: date_key
        description: "INTEGER yyyymmdd. Primary key."
        tests: [not_null, unique]
      - name: full_date
        description: "DATE. The day itself."
        tests: [not_null, unique]
      - name: week_start_date
        description: "DATE. Monday of this day's ISO week."
        tests: [not_null]
      - name: week_date_key
        description: "INTEGER yyyymmdd of week_start_date. This is what the weekly facts carry."
        tests: [not_null]

  - name: int_song_chart_daily
    description: >
      Layer 2. Grain: chart day x country x canonical song x rank (rank is in the grain
      because one song can hold two positions in a day via two alias URIs).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [chart_date, country_code, track_uri, rank]
    columns:
      - name: chart_date
        description: "DATE."
        tests: [not_null]
      - name: country_code
        description: "VARCHAR. ISO-2 market or 'global'."
        tests: [not_null]
      - name: track_uri
        description: "VARCHAR. Canonical song, alias-resolved."
        tests:
          - not_null
          - relationships: {to: ref('int_song'), field: track_uri}
      - name: label_name_norm
        description: "VARCHAR. Normalised label, '(unknown)' when absent."
        tests:
          - not_null
          - relationships: {to: ref('int_label'), field: label_name_norm}
      - name: streams
        description: "BIGINT, nullable."
        tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: rank
        description: "INTEGER 1-200."
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 200}

  - name: int_artist_chart_daily
    description: >
      Layer 2. Grain: chart day x country x artist x rank. rank is in the grain because
      the source genuinely lists the same artist twice in one day (3,436 cases).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [chart_date, country_code, artist_uri, rank]
    columns:
      - name: chart_date
        description: "DATE."
        tests: [not_null]
      - name: country_code
        description: "VARCHAR."
        tests: [not_null]
      - name: artist_uri
        description: "VARCHAR."
        tests:
          - not_null
          - relationships: {to: ref('int_artist'), field: artist_uri}
      - name: rank
        description: "INTEGER 1-200."
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 200}

  # int_song_chart_weekly / int_artist_chart_weekly are views whose rows are
  # materialised by fact_song_weekly / fact_artist_weekly. Their tests live on the
  # mart tables (_marts.yml) so the window functions are evaluated once, not once
  # per test.
  - name: int_song_chart_weekly
    description: "Layer 3 view. Weekly song metrics; materialised as fact_song_weekly."
  - name: int_artist_chart_weekly
    description: "Layer 3 view. Weekly artist metrics; materialised as fact_artist_weekly."
