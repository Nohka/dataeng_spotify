version: 2

sources:
  - name: spotify
    description: >
      Raw Kaggle "Spotify Charts Daily Updated" tables, loaded by the Airflow DAG into the raw
      Postgres database (schema raw). All columns are text; staging owns the casts.
    database: raw                 # the attached Postgres catalog (alias in profiles.yml)
    schema: raw
    tables:
      - name: charts_songs_daily
        description: Daily Top 200 song chart per country, from the DAG's start_date onwards. One row per date x country x rank.
      - name: charts_artists_daily
        description: Daily artist chart per country, from the DAG's start_date onwards. One row per date x country x rank.
      - name: songs
        description: One row per song. all_uris lists every Spotify URI of the same song. Full snapshot.
      - name: artists
        description: One row per artist URI. Full snapshot.
